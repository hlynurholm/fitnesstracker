# Sets the program start date (Monday of week 1) in the live database, so the calendar and week
# numbering restart from that date. Logged history is kept; days before the date show as "Before the plan".
# Run it from the Actions tab (Run workflow) with the date, or leave it empty to clear the setting
# so the default in public/js/program.js applies. Needs the same two repository secrets as the deploy workflow.
name: Program start
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Monday of week 1 as YYYY-MM-DD (empty clears the setting)
        required: false
        default: ""
        type: string
      reset_run_target:
        description: also clear the saved 5 km target so the default from program.js applies
        required: false
        default: false
        type: boolean
jobs:
  start:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      START_DATE: ${{ inputs.start_date }}
      RESET_RUN_TARGET: ${{ inputs.reset_run_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write SQL
        run: |
          if [ -z "$START_DATE" ]; then
            echo "DELETE FROM settings WHERE key = 'program_start_date';" > start.sql
          else
            echo "$START_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "start_date must be YYYY-MM-DD"; exit 1; }
            echo "INSERT INTO settings (key, value, updated_at) VALUES ('program_start_date', '$START_DATE', datetime('now')) ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = datetime('now');" > start.sql
          fi
          if [ "$RESET_RUN_TARGET" = "true" ]; then echo "DELETE FROM settings WHERE key = 'five_k_target_sec';" >> start.sql; fi
          cat start.sql
      - name: Apply to D1
        run: npx wrangler d1 execute fitness-tracker-db --remote --file start.sql
      - name: Show the setting
        run: npx wrangler d1 execute fitness-tracker-db --remote --command "SELECT key, value FROM settings WHERE key IN ('program_start_date', 'five_k_target_sec')"
