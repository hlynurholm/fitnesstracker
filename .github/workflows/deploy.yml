# Runs the tests on every push to main. Deploys to Cloudflare Workers as well when the two
# repository secrets exist: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the deploy steps are skipped and the run stays green.
# The D1 database id must already be in wrangler.jsonc (scripts/setup-cloudflare.sh writes it).
name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply fitness-tracker-db --remote
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set as a repository secret, so only the tests ran."
